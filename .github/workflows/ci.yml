name: CI

# Pull requests and pushes to main run the full tests. The hourly schedule only refreshes the
# NASA and NOAA data: it rebuilds, checks the built site and deploys, without re-running the
# test suite on unchanged code, so a flaky test or a browser install can't stop the data update.
# Run "CI" by hand from the Actions tab (workflow_dispatch) for the same data refresh on demand.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: read

# Actions are pinned to exact commits (tags can be moved); Dependabot proposes updates weekly.

# One run per branch at a time. A newer run replaces one that is still waiting to start. Once
# started, runs on main are never cancelled, so a deploy is never cut off; pull request runs are.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node 24 ships npm 11; npm 10.9 (Node 22) crashes on this dependency tree.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm test

      - name: Install browser for smoke tests
        run: npx playwright install --with-deps chromium

      # Builds offline at the root path with a sample data file, then checks it in a real browser.
      - name: Smoke tests
        run: npm run test:e2e

      - name: Upload smoke test traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: test-results
          retention-days: 7

  # Builds the site that is actually deployed: live data, Pages base path. Runs after the tests
  # on pushes to main, and on its own for scheduled and manual runs.
  build:
    needs: test
    if: >-
      always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Fetches NASA and NOAA data into data/weather.json. A feed that fails keeps the
      # last good copy from the live site instead of replacing it with nothing.
      - name: Build for Pages
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PREVIOUS_DATA_URL: ${{ steps.pages.outputs.base_url }}/data/weather.json

      # No browser: checks the base path, that every referenced file exists, and that the data
      # file passes the same validator the page uses.
      - name: Check the built site
        run: npm run test:build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Show data summary
        run: |
          node -e '
            const d = require("./build/data/weather.json");
            const w = d.solarWind.summary;
            console.log(`Mars: ${d.mars.source}, sol ${d.mars.report.sol} (${d.mars.report.earthDate})${d.mars.error ? ", error: " + d.mars.error : ""}`);
            console.log(`Solar wind: ${d.solarWind.source}${w ? `, ${w.latest.speed} km/s at ${w.latest.time} from ${w.latest.source}, ${w.series.length} points` : ""}${d.solarWind.error ? ", error: " + d.solarWind.error : ""}`);
            const k = d.kp.summary;
            console.log(`Kp: ${d.kp.source}${k ? `, ${k.latest.kp} for ${k.latest.time}, ${k.series.length} intervals` : ""}${d.kp.error ? ", error: " + d.kp.error : ""}`);
            const x = d.xray.summary;
            const c = require("./build/data/spacecraft.json");
            console.log(`Spacecraft: ${c.craft.map((t) => `${t.id} ${t.source} (${t.p.length / 3} samples)`).join(", ") || "none"}${c.missing.length ? `; missing: ${c.missing.map((m) => `${m.id} (${m.reason})`).join("; ")}` : ""}`);
            console.log(`X-ray: ${d.xray.source}${x ? `, ${x.latest.flux} W/m² at ${x.latest.time}, 24 h peak ${x.peak.flux} at ${x.peak.time}, ${x.series.length} points` : ""}${d.xray.error ? ", error: " + d.xray.error : ""}`);
          ' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build

  deploy:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
