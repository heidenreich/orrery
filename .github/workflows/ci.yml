name: CI

# Branches are checked through their pull request, so each change runs once.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded pull request runs are cancelled; runs on main finish so a deploy is never cut off.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node 24 ships npm 11; npm 10.9 (Node 22) crashes on this dependency tree.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm test

      - name: Install browser for smoke tests
        run: npx playwright install --with-deps chromium

      # Builds and serves the site at the root path, then checks it in a real browser.
      - name: Smoke tests
        run: npm run test:e2e

      - name: Upload smoke test traces
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: test-results
          retention-days: 7

      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Build for Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
